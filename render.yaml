services:
  - type: web
    name: emigria-backend
    runtime: node
    rootDir: back-end
    branch: main
    region: singapore
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        value: https://ai-model-rha2.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://emigria.vercel.app
